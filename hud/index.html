/* Layout: full-bleed 3D bench; part index left, part sheet right, control dock along the bottom. One dark look, by choice. */
:root {
  --bg: #0b0e12;
  --panel: rgba(16, 20, 26, 0.88);
  --panel-solid: #121820;
  --line: #243040;
  --fg: #e6ebef;
  --muted: #8b98a5;
  --accent: #ffb547;   /* LED amber: controls, selection */
  --ray: #6fe7ff;      /* HUD light */

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

.top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 16px); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; pointer-events: none; z-index: 5; }

.brand { display: grid; gap: 2px; }
.brand .eyebrow { font: 500 11px/1 var(--mono); letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); font-size: 12px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 12px; color: var(--fg); white-space: nowrap; }
.chip:hover { border-color: #3a4a5c; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 4; }

.pitem:hover { background: rgba(255,255,255,.04); }
.pitem.on { background: rgba(255,181,71,.10); }
.pitem.on .pname { color: var(--accent); }
.pitem.sub { padding-left: 24px; }
.pitem .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.pitem .pname { text-align: left; flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
.pitem .pname small { display: block; color: var(--muted); font: 400 10.5px/1.3 var(--mono); }
.pitem .eye { flex: none; width: 22px; height: 22px; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
.pitem .eye:hover { background: rgba(255,255,255,.08); color: var(--fg); }
.pitem.hiddenpart .pname { opacity: .4; }

#info { right: calc(env(safe-area-inset-right, 0px) + 16px); top: 108px; bottom: 132px; width: 360px; overflow: auto; padding: 14px 16px 18px; }
#info h3 { margin: 0; font-size: 19px; line-height: 1.3; text-wrap: balance; }
#info .en { font: 400 12px/1.4 var(--mono); color: var(--muted); margin-top: 3px; }
#info p { line-height: 1.65; margin: 10px 0; color: #cfd7de; }
#info ul { margin: 8px 0; padding-left: 18px; display: grid; gap: 7px; }
#info li { line-height: 1.6; color: #cfd7de; }
.badge { display: inline-block; font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 4px; border: 1px solid; margin-right: 4px; letter-spacing: .02em; }
.badge.photo { color: var(--ok); border-color: rgba(127,220,160,.4); }
.badge.guess { color: var(--warn); border-color: rgba(255,138,92,.4); }
.specs { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 12px 0; font-size: 12.5px; }
.specs dt { color: var(--muted); }

.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
.thumbs button { aspect-ratio: 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.thumbs button:hover img { transform: scale(1.06); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.btn { padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.03); font-size: 12.5px; }
.btn:hover { border-color: #3a4a5c; }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.journey { list-style: none; padding: 0 !important; margin: 8px 0; display: grid; gap: 4px !important; counter-reset: j; }
.journey li { counter-increment: j; }
.journey button { width: 100%; text-align: left; display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 8px; border-radius: 8px; line-height: 1.45; }
.journey button::before { content: counter(j); font: 500 11px/20px var(--mono); text-align: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); color: var(--ray); }
.journey button:hover { background: rgba(111,231,255,.06); }
.journey button.on { background: rgba(111,231,255,.10); }
.journey b { font-weight: 600; color: var(--fg); }
.journey b, .journey span { grid-column: 2; }
.journey span { color: var(--muted); font-size: 12.5px; }
.journey button::before { grid-row: 1 / span 2; }
.readout { font: 400 12px/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 10px; }
.readout b { color: var(--ray); font-weight: 500; }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; }

#dock { left: calc(env(safe-area-inset-left, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); padding: 10px 12px; display: flex; gap: 8px 18px; align-items: center; overflow-x: auto; scrollbar-width: thin; }
.ctl { display: grid; gap: 5px; flex: none; }
.ctl > label, .ctl > .lab { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.ctl output { color: var(--accent); text-transform: none; letter-spacing: 0; margin-left: 4px; }
.ctl input[type=range] { width: 140px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { padding: 5px 9px; font-size: 12px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: rgba(255,181,71,.14); color: var(--accent); }
.tog { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; white-space: nowrap; padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; }
.tog::before { content: ""; width: 26px; height: 14px; border-radius: 7px; background: #2a3440; box-shadow: inset 0 0 0 1px #3a4756; transition: background .2s; flex: none; background-image: radial-gradient(circle at 7px 7px, #9aa6b2 5px, transparent 5.5px); }
.tog[aria-pressed="true"] { border-color: rgba(255,181,71,.5); }
.tog[aria-pressed="true"]::before { background-color: var(--accent); background-image: radial-gradient(circle at 19px 7px, #1a1206 5px, transparent 5.5px); }
.vsep { width: 1px; align-self: stretch; background: var(--line); flex: none; }

#tip { position: fixed; pointer-events: none; z-index: 8; padding: 5px 8px; border-radius: 6px; background: var(--panel-solid); border: 1px solid var(--line); font-size: 12px; transform: translate(12px, 12px); white-space: nowrap; }
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.lbl { position: absolute; transform: translate(-50%, -100%); font-size: 11.5px; white-space: nowrap; padding: 3px 7px; border-radius: 5px; background: rgba(11,14,18,.82); border: 1px solid var(--line); color: var(--fg); }
.lbl::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 10px; background: var(--muted); }
.lbl.env { color: var(--ray); border-color: rgba(111,231,255,.35); }
.mtoggle { display: none; }
#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); font-size: 12px; color: var(--muted); z-index: 2; pointer-events: none; text-align: center; }

#lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(5,7,10,.92); display: grid; grid-template-rows: 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + 50px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
#lightbox img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; display: block; min-height: 0; }
#lightbox .lbbar { display: flex; gap: 10px; align-items: center; justify-content: center; padding-top: 12px; color: var(--muted); font-size: 13px; }
#lightbox .close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); }

@media (max-width: 860px) {
  .brand h1 { font-size: 16px; }
  .brand p { display: none; }
  #parts { top: auto; bottom: 120px; left: 12px; right: 12px; width: auto; max-height: 46vh; }
  #info { top: auto; bottom: 120px; left: 12px; right: 12px; width: auto; max-height: 46vh; }
  #dock { left: 12px; right: 12px; }
  .mtoggle { display: inline-flex; }
  #hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .thumbs img { transition: none; } }

</div>

      if (seg >= 1 && !rayLit[r]) { spawn(i, false); s = 0; seg = 0; }
      if (seg === 4 && !state.env) { spawn(i, false); s = 0; seg = 0; }
      const t0 = seg ? SEG_C[seg - 1] : 0, u = (s - t0) / SEG_T[seg];
      const a = paths[r][seg], b = paths[r][seg + 1];
      pPos[i * 3] = a.x + (b.x - a.x) * u; pPos[i * 3 + 1] = a.y + (b.y - a.y) * u; pPos[i * 3 + 2] = a.z + (b.z - a.z) * u;
      let al = 1;
      if (seg === 0) { col.setRGB(1, .9, .72); al = rayLit[r] ? .9 : (u > .8 ? (1 - u) * 5 * .9 : .9); }
      else { const c = rayCol[r]; col.setRGB(c[0], c[1], c[2]); }
      const hs = state.hl >= 0 ? JOURNEY[state.hl].seg : -1;
      if (hs >= 0 && hs <= 4 && seg !== hs) al *= .12;
      pCol[i * 3] = col.r; pCol[i * 3 + 1] = col.g; pCol[i * 3 + 2] = col.b; pAl[i] = al;
    }
    pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true; pGeo.attributes.alpha.needsUpdate = true;
  }
  if (hotSpot.visible) { const s = 1 + .25 * Math.sin(now / 160); hotSpot.scale.setScalar(s); }
  renderer.render(scene, camera);
  drawLabels();
  requestAnimationFrame(tick);
}

resize(); layoutMode(); rebuildLight(); OPT0 = OPT; applyVisual(); renderInfo(); syncToggles();
cam.target.copy(cam.gT); cam.r = cam.gR; cam.th = cam.gTh; cam.ph = cam.gPh;
requestAnimationFrame(tick);
document.fonts && document.fonts.ready.then(() => { drawHUD(); rebuildLight(); [pcbTex, fpcTex, labelTex].forEach(t => t.needsUpdate = true); renderInfo(); });
window.__hud = { OPT: () => OPT, RAD, LCDR, HFOV: () => HFOV, VFOV: () => VFOV, state, parts };
</script>
