<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeekr 7X AR-HUD 해부도</title>
<meta name="description" content="Zeekr 7X AR-HUD(HA1SZK63E)를 분해 사진과 BOM으로 재구성한 3D 해부도. 부품별 보기, 분해, 차량 장착 상태의 광로.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Pretendard (SIL OFL 1.1, fonts/Pretendard-LICENSE.txt) shipped with the page: one variable file for every weight */
@font-face { font-family: 'Pretendard Variable'; font-weight: 45 920; font-style: normal; font-display: swap; src: url('fonts/PretendardVariable.woff2') format('woff2-variations'), url('fonts/PretendardVariable.woff2') format('woff2'); }
/* Layout: the 3D stage fills everything under a slim header. Three folding windows float over it:
   parts (top-left, list ⇄ part detail), playback (top-right), product info (bottom-right). Light, plain engineering look. */
:root {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --line: #dde1e6;
  --line-2: #eceff2;
  --fg: #1c2228;
  --muted: #66717c;
  --accent: #1f62d1;
  --accent-soft: #e8f0fd;
  --amber: #c8780f;
  --ok: #1f8a4c;
  --stage: #e6e9ed;
  --hdr: 52px;
  --sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--stage); color: var(--fg); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

header { position: fixed; z-index: 10; top: 0; left: 0; right: 0; height: calc(var(--hdr) + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 8px 18px; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 15.5px; font-weight: 700; white-space: nowrap; }
header .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ttl { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.sp { flex: 1; }
.viewbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.viewbar .lab { font-size: 12px; font-weight: 600; color: var(--fg); white-space: nowrap; }
.views { display: flex; padding: 3px; gap: 3px; background: var(--line-2); border: 1px solid var(--line); border-radius: 9px; }
.views button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--fg); white-space: nowrap; }
.views button svg { width: 15px; height: 15px; flex: none; opacity: .75; }
.views button:hover { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.views button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 1px 3px rgba(31,98,209,.35); }
.views button[aria-pressed="true"] svg { opacity: 1; }
.hdr-btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px 6px 7px; border-radius: 9px; font-size: 13.5px; font-weight: 600; border: 1px solid #c2d4f3; border-left: 3px solid var(--accent); background: var(--panel); white-space: nowrap; box-shadow: 0 2px 8px rgba(20,30,40,.06); }
.hdr-btn .ic { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.hdr-btn .ic svg { width: 14px; height: 14px; }
.hdr-btn .chev { color: var(--accent); font-size: 12px; font-weight: 500; }
.hdr-btn:hover { background: var(--accent-soft); }
.hdr-btn[aria-expanded="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.hdr-btn[aria-expanded="true"] .ic { background: rgba(255,255,255,.2); color: #fff; }
.hdr-btn[aria-expanded="true"] .chev { color: #fff; }

.stage { position: fixed; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0; background: var(--stage); overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

.float { position: absolute; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(20,30,40,.10); display: flex; flex-direction: column; min-height: 0; }
.phead { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 10px 10px 0 0; font-weight: 700; font-size: 13.5px; }
.phead .ic { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; flex: none; }
.phead .x { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
.phead .x:hover { background: var(--line-2); color: var(--fg); border-color: #b9c1c9; }
.pbody { overflow: auto; min-height: 0; padding: 10px 14px 14px; }
.fbtn { position: absolute; z-index: 4; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 9px; background: var(--panel); border: 1px solid #c2d4f3; border-left: 3px solid var(--accent); box-shadow: 0 4px 14px rgba(20,30,40,.10); font-size: 13.5px; font-weight: 600; color: var(--fg); white-space: nowrap; }
.fbtn .ic { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; }
.fbtn .chev { color: var(--accent); font-size: 12px; font-weight: 500; }
.fbtn:hover { background: var(--accent-soft); }
.col { position: absolute; z-index: 4; top: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.col > * { pointer-events: auto; }
.lcol { left: max(12px, env(safe-area-inset-left, 0px)); width: 300px; align-items: flex-start; }
.rcol { right: max(12px, env(safe-area-inset-right, 0px)); width: 330px; align-items: flex-end; }
.col .sp { flex: 1; pointer-events: none; }
.col .float { position: relative; width: 100%; }
.fbtn { position: relative; }
#left { flex: 0 1 auto; max-height: 100%; }
#left .pbody { padding: 0 0 12px; }
#play { flex: 0 0 auto; max-height: 52%; }
#info { flex: 0 1 auto; max-height: 100%; }
#info.big { flex: 1 1 auto; }
#settings { position: fixed; z-index: 11; top: calc(var(--hdr) + env(safe-area-inset-top, 0px) + 6px); right: max(12px, env(safe-area-inset-right, 0px)); width: 310px; padding: 0 14px 14px; display: grid; gap: 12px; border-top: 3px solid var(--accent); }
#settings .phead { border-top: 0; margin: 0 -14px; border-radius: 0; }
.ctl { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl output { font-family: var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { padding: 4px 9px; font-size: 12.5px; color: var(--fg); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg); cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
.chks { display: flex; gap: 14px; }

/* parts tree */
.lv1-title { padding: 7px 14px; background: var(--line-2); font-weight: 700; font-size: 12.5px; position: sticky; top: 0; z-index: 1; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px; padding: 2px 8px 2px 0; border-left: 3px solid transparent; }
.row:hover { background: #f6f8fa; }
.row.on { background: var(--accent-soft); border-left-color: var(--accent); }
.row .nm { text-align: left; padding: 4px 0 4px var(--ind, 26px); font-size: 13px; line-height: 1.35; min-width: 0; }
.row.on .nm { color: var(--accent); font-weight: 600; }
.row .mat { font: 400 11px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.row .eye { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: #9aa4ae; }
.row .eye:hover { background: var(--line); color: var(--fg); }
.row.off .nm { opacity: .4; }

/* part detail */
.detail { padding: 10px 14px 0; }
.back { font-size: 12.5px; color: var(--accent); padding: 2px 0; margin-bottom: 8px; }
.crumb { font: 500 11px/1.3 var(--mono); color: var(--muted); margin-bottom: 4px; }
.detail h2 { margin: 0; font-size: 17px; line-height: 1.3; text-wrap: balance; }
.detail .en { font: 400 12px/1.4 var(--mono); color: var(--muted); margin: 2px 0 6px; }
.detail p, .pbody p { margin: 6px 0 8px; line-height: 1.65; font-size: 13.5px; }
.detail ul, .detail ol, .pbody ul { margin: 6px 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13px; }
.detail li { line-height: 1.6; }
.badge { display: inline-block; font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
.badge.photo { color: var(--ok); border-color: #b5dcc4; background: #f1faf4; }
.badge.bom { color: var(--accent); border-color: #c2d4f3; background: var(--accent-soft); }
.badge.guess { color: var(--amber); border-color: #ecd2ad; background: #fdf6ec; }
h3.sec { font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .06em; margin: 14px 0 8px; text-transform: uppercase; }
.specs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 12.5px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.specs dd.txt { font-family: var(--sans); font-size: 12.5px; line-height: 1.5; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.thumbs button { aspect-ratio: 1; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); background: #ddd; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.btn { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; background: var(--panel); white-space: nowrap; }
.btn:hover { border-color: #b9c1c9; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 4px; }
.kids { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.kids button { padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; }
.kids button:hover { border-color: var(--accent); color: var(--accent); }
.readout { font: 400 12px/1.7 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; background: #f6f8fa; border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 9px; margin: 8px 0; }
.readout b { color: var(--fg); font-weight: 500; }
.note { font-size: 12px; color: var(--muted); line-height: 1.55; }
.src { font-size: 12px; line-height: 1.6; padding-left: 16px; }
.tablewrap { overflow-x: auto; }
.ptable { width: 100%; border-collapse: collapse; font-size: 12px; }
.ptable th { text-align: left; font-weight: 600; color: var(--muted); padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
.ptable td { padding: 5px 6px 5px 0; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.ptable td.mono { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:hover { background: #f6f8fa; }
.tabs { display: flex; gap: 2px; flex: none; }
.tabs button { flex: none; white-space: nowrap; padding: 7px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
body[data-tab="spec"] .stage, body[data-tab="spec"] .viewbar, body[data-tab="spec"] #setBtn { display: none; }
#specPage { position: fixed; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0; overflow: auto; background: var(--bg); }
.sp-wrap { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#specBody { flex: 1; min-height: 0; overflow: auto; }
.sp-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.sp-head h2 { margin: 0; font-size: 17px; }
.vid { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.vid input { width: 64px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; color: var(--fg); }
.sp-views { background: var(--panel); }
.hint2 { font-size: 11.5px; color: var(--muted); }
.sp-grid { height: 100%; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; }
.sp-list { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 0 8px; overflow: auto; min-height: 0; }
.sp-cat { display: flex; align-items: center; gap: 7px; font: 700 11.5px/1 var(--sans); color: var(--fg); padding: 12px 12px 6px; }
.sp-cat::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cat); }
.sp-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 10px 6px 12px; border-left: 3px solid transparent; font-size: 13.5px; }
.sp-item .t { flex: 1; min-width: 0; }
.sp-item .u { font: 500 10.5px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.sp-item small { display: block; font: 400 11px/1.3 var(--mono); color: var(--muted); }
.sp-item:hover { background: #f6f8fa; }
.sp-item.on { background: color-mix(in srgb, var(--cat) 10%, white); border-left-color: var(--cat); color: var(--cat); font-weight: 600; }
.sp-item.on .u { color: var(--cat); }
.sp-detail { min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; }
.sp-main { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sp-side { min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px 16px; }
.sp-side ul { padding-left: 18px; display: grid; gap: 5px; margin: 4px 0; }
.sp-side li { line-height: 1.55; font-size: 13px; }
.sp-hero { padding: 12px 18px 12px; border-top: 4px solid var(--cat); background: linear-gradient(180deg, color-mix(in srgb, var(--cat) 7%, white), white); border-bottom: 1px solid var(--line-2); }
.eyebrow { font: 700 11.5px/1 var(--sans); color: var(--cat); letter-spacing: .04em; margin-bottom: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.facts div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.facts span { font-size: 11.5px; color: var(--muted); }
.facts b { font: 600 13.5px/1.2 var(--mono); color: var(--fg); overflow-wrap: anywhere; }
.facts b.empty { color: #aab3bc; font-weight: 500; font-family: var(--sans); font-size: 13px; }
.lead { font-size: 14px; line-height: 1.7; margin: 10px 0 4px; }
.schem { margin: 4px 0 8px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd; padding: 6px 6px 8px; }
.schem svg { width: 100%; height: auto; display: block; }
.schem figcaption { font-size: 11.5px; color: var(--muted); padding: 2px 6px 0; }
.schem .node { cursor: pointer; }
.schem .part, .schem .housing, .schem .glass { fill: none; stroke: #b7c0c9; stroke-width: 2; }
.schem rect.part, .schem circle.part { fill: #eef1f4; }
.schem .housing { stroke-dasharray: 4 3; stroke-width: 1.2; }
.schem .glass { stroke-width: 3; stroke: #c9dbe9; }
.schem .lv1 .part, .schem .lv1 .glass, .schem .lv1 .housing { stroke: var(--cat); stroke-width: 2.4; }
.schem .lv1 rect.part, .schem .lv1 circle.part { fill: #fff; }
.schem .lv2 .part, .schem .lv2 .glass, .schem .lv2 .housing { stroke: var(--cat); stroke-width: 3.4; }
.schem .lv2 rect.part, .schem .lv2 circle.part { fill: var(--cat); }
.schem .node:hover .part, .schem .node:hover .glass { stroke-width: 4; }
.schem .beam { fill: none; stroke: var(--cat); stroke-width: 1.6; opacity: .5; }
.schem .beam.virt { stroke-dasharray: 5 5; opacity: .35; }
.schem .eye { fill: var(--fg); }
.schem .eyebox { fill: none; stroke: var(--fg); stroke-dasharray: 3 2; }
.schem .vi { stroke: var(--fg); stroke-width: 4; }
.schem .lab { font: 500 11px var(--sans); fill: #9aa4ae; }
.schem .lab.lv1 { fill: var(--fg); }
.schem .lab.lv2 { fill: var(--cat); font-weight: 700; }
.schem .lab.small { font-size: 9.5px; fill: var(--muted); }
.sp-detail .pchip.lv2 { border-color: var(--cat); color: var(--cat); }
.sp-detail .demo-out b { color: var(--cat); }
.vidbox { max-width: 340px; display: grid; gap: 4px; }
.vidbox .note { margin: 0; font-size: 11.5px; }
.sp-detail > p { line-height: 1.7; max-width: 75ch; margin: 6px 0 4px; }
.sp-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.sp-title h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.sp-title .en { font: 400 12.5px/1.3 var(--mono); color: var(--muted); }
.sp-title .unit { font: 500 12px/1 var(--mono); padding: 4px 7px; border-radius: 4px; background: var(--line-2); }
.sp-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 4px 28px; }
.sp-cols ul { padding-left: 18px; display: grid; gap: 6px; margin: 4px 0; }
.sp-cols li { line-height: 1.6; font-size: 13.5px; }
.sp-key { border-left: 3px solid var(--cat); padding: 2px 0 2px 10px; }
.sp-key .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sp-key .sys { font-size: 12.5px; color: var(--muted); }
.sp-key p { margin: 6px 0 0; font-size: 13px; line-height: 1.6; }
.pchip { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
.pchip.lv2 { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pchip:hover { background: var(--accent-soft); }
.demo { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fbfcfd; }
.sp-main .demo { flex: 1; min-height: 0; display: flex; flex-direction: column; border: 0; border-radius: 0; }
.sp-main .demo canvas { flex: 1; min-height: 160px; height: auto; }
.demo canvas { display: block; width: 100%; height: clamp(220px, 32vw, 320px); }
.demo-ctl { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 10px 14px 0; font-size: 12.5px; color: var(--muted); }
.demo-ctl label { display: flex; align-items: center; gap: 8px; }
.demo-ctl input[type=range] { width: 170px; accent-color: var(--accent); }
.demo-ctl select { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.demo-ctl output { font-family: var(--mono); color: var(--fg); min-width: 5em; }
.demo-out { margin: 8px 14px 12px; font-size: 13px; line-height: 1.65; }
.demo-out b { color: var(--accent); }
.sp-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sp-form .wide { grid-column: 1 / -1; }
.sp-form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.sp-form input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; color: var(--fg); min-width: 0; }
.iss-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 14px; align-items: start; }
.iss-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
@media (max-width: 1000px) { .iss-layout { grid-template-columns: minmax(0, 1fr); } }
.iss { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }

.ef { display: grid; gap: 3px; min-width: 0; }

.ef.w { grid-column: 1 / -1; }
.ef.sm { grid-column: span 1; }
.ef input:not([type=checkbox]) { width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; font: 500 13px/1.3 var(--sans); color: var(--fg); background: var(--panel); }
.ef input:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
#ef-raw-t, #ef-raw-tol { font-family: var(--mono); font-size: 12.5px; background: #f6f8fa; }
.ef.chk { display: flex; align-items: center; gap: 6px; grid-column: span 3; font-size: 12px; color: var(--muted); }
.er-row { display: grid; gap: 6px; justify-items: start; }
.er-f { display: flex; gap: 8px; width: 100%; }
.er-f .ef { flex: 0 1 130px; }
.rl { font-size: 11.5px; color: var(--muted); }
.sg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.sg button { padding: 6px 10px; font-size: 12.5px; color: var(--muted); border-right: 1px solid var(--line); white-space: nowrap; }

.res .v { font-size: 16px; }
.res p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
.res-ok, .res-cond { background: #eef4fd; border-color: #c2d4f3; }
.res-check { background: #fdf6ec; border-color: #ecd2ad; }
.rj { border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
.sts { display: grid; gap: 6px; }
.sts button { display: grid; gap: 1px; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.sts button b { font-size: 13px; }
.sts button span { font-size: 11.5px; color: var(--muted); }

.sts button[aria-pressed="true"].st-cond { border-color: #1f62d1; background: #e9f0fc; box-shadow: inset 3px 0 0 #1f62d1; }
.sts button[aria-pressed="true"].st-check { border-color: #d1493f; background: #fbeceb; box-shadow: inset 3px 0 0 #d1493f; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.d-ok { background: #2a9d6a; } .d-cond { background: #1f62d1; } .d-check { background: #d1493f; } .d-empty { background: transparent; border: 1.5px solid #b7c0c9; }
.sp-item .dot { margin-right: 2px; }

@media (max-width: 900px) { .sp-main { overflow: visible; } .sp-main .demo canvas { height: 260px; } }
/* LookDown / LookOver lesson */
.lesson { --ink: var(--fg); --soft: #eef1f4; --eye: #1f5fd1; --ref: var(--muted); --img: #b86400; --glass: #2a8585; --diff: #b8326a; --ok: #24784a; --bad: #b8322a; display: grid; gap: 12px; font-size: 14.5px; line-height: 1.65; color: var(--ink); }
.lesson .ls-fig { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
.lesson .ls-text { display: grid; gap: 12px; min-width: 0; }
.lesson .ls-nav { display: flex; justify-content: space-between; gap: 8px; }
.lesson .ls-steps { display: flex; flex-wrap: wrap; gap: 6px; }
.lesson .ls-steps button { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 12px 7px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); font: 500 13.5px/1 var(--sans); cursor: pointer; }
.lesson .ls-steps button .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--ink); font: 600 12px/1 var(--mono); }
.lesson .ls-steps button[aria-current="true"] { border-color: var(--eye); color: var(--ink); font-weight: 600; }
.lesson .ls-steps button[aria-current="true"] .n { background: var(--eye); color: var(--panel); }
.lesson .ls-steps button:focus-visible, .lesson button:focus-visible, .lesson input:focus-visible { outline: 2px solid var(--eye); outline-offset: 2px; }
.lesson .ls-stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.lesson .ls-fig { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
.lesson .ls-fig svg { display: block; width: 100%; height: auto; }
.lesson .ls-text { min-width: 0; display: grid; gap: 12px; }
.lesson .ls-text h2 { margin: 0; font-size: 19px; text-wrap: balance; }
.lesson .ls-text p { margin: 0; max-width: 62ch; }
.lesson .ls-ctl { display: grid; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.lesson .ls-ctl label { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 5.2em; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); }
.lesson .ls-ctl input[type=range] { width: 100%; accent-color: var(--eye); }
.lesson .ls-ctl output { font: 600 13.5px/1 var(--mono); color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.lesson .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lesson .nums label { display: grid; gap: 4px; grid-template-columns: none; font-size: 12.5px; }
.lesson .nums input { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: 600 15px/1 var(--mono); }
.lesson .readout { display: grid; gap: 6px; background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.lesson .readout b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.lesson .kv { display: flex; justify-content: space-between; gap: 12px; }
.lesson .kv span { color: var(--muted); }
.lesson .tag { display: inline-block; font: 600 11px/1.5 var(--sans); padding: 0 6px; border-radius: 4px; margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
.lesson .t-src { color: var(--eye); border: 1px solid var(--eye); }
.lesson .t-asm { color: var(--img); border: 1px dashed var(--img); }
.lesson .t-hyp { color: var(--diff); border: 1px dashed var(--diff); }
.lesson .t-chk { color: var(--bad); border: 1px solid var(--bad); }
.lesson .note { font-size: 13px; color: var(--muted); }
.lesson .cards { display: grid; gap: 8px; }
.lesson .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.lesson .card h3 { margin: 0; font-size: 14.5px; }
.lesson .card p { font-size: 14px; }
.lesson .verdict { display: inline-block; font: 700 13px/1 var(--sans); padding: 5px 9px; border-radius: 6px; }
.lesson .v-ok { color: var(--ok); border: 1.5px solid var(--ok); }
.lesson .v-bad { color: var(--bad); border: 1.5px dashed var(--bad); }
.lesson table.src { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--panel); }
.lesson table.src th, .lesson table.src td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.lesson table.src th { background: var(--soft); font-weight: 600; font-size: 12.5px; color: var(--muted); }
.lesson table.src td.m { font-family: var(--mono); font-weight: 600; }
.lesson .tw { overflow-x: auto; }
.lesson .q { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.lesson .q blockquote { margin: 0; font-size: 14.5px; }
.lesson .btn { justify-self: start; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 13.5px/1 var(--sans); cursor: pointer; }
.lesson .btn.primary { background: var(--eye); border-color: var(--eye); color: var(--panel); }
.lesson .ls-nav { display: flex; justify-content: space-between; gap: 8px; }
.lesson svg text { font-family: var(--sans); fill: var(--ink); }
.lesson svg .mono { font-family: var(--mono); }
@media (max-width: 860px) { .lesson .ls-stage { grid-template-columns: minmax(0, 1fr); } .lesson .ls-ctl label { grid-template-columns: 7.5em minmax(0, 1fr) 4.6em; } }
@media (prefers-reduced-motion: no-preference) { .ls-fig svg * { transition: none; } }
.sp-detail { grid-template-columns: minmax(0, 1fr) 12px var(--sideW, 400px) !important; gap: 0 !important; }
.sp-split { cursor: col-resize; position: relative; touch-action: none; }
.sp-split::after { content: ""; position: absolute; top: 50%; left: 50%; width: 4px; height: 44px; margin: -22px 0 0 -2px; border-radius: 2px; background: var(--line); }
.sp-split:hover::after, .sp-split.on::after, .sp-split:focus-visible::after { background: var(--accent); }
.sp-split:focus-visible { outline: none; }
.sp-more { padding: 14px 18px 18px; border-top: 1px solid var(--line-2); display: grid; gap: 8px; font-size: 14px; line-height: 1.65; }
.sp-more h3 { margin: 0; font-size: 14px; }
.sp-more p { margin: 0; max-width: 70ch; }
.sp-more ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.sp-more details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.sts2 button { flex: 1 1 auto; }
.sp-side .ent-step h3 { font-size: 14.5px; }
.sp-side .ent-step h4 { display: flex; align-items: center; justify-content: space-between; }
@media (max-width: 900px) { .sp-detail { grid-template-columns: minmax(0, 1fr) !important; gap: 12px !important; } .sp-split { display: none; } }
.lesson { container-type: inline-size; }
.lesson .ls-body { display: grid; gap: 14px; align-items: start; }
@container (min-width: 760px) { .lesson .ls-body { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
.lesson .ls-fig svg { max-height: 360px; margin: 0 auto; }
.lesson .ls-ctl label { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "l o" "r r"; gap: 2px 10px; }
.lesson .ls-ctl label > span { grid-area: l; }
.lesson .ls-ctl label > output { grid-area: o; }
.lesson .ls-ctl input[type=range] { grid-area: r; width: 100%; min-width: 0; height: 26px; margin: 0; }

/* ───────── design layer: a quiet instrument look ─────────
   One cobalt accent for "selected / primary", neutral surfaces with soft depth instead of coloured frames,
   segmented controls that select with a raised white chip, and monospace only where digits line up. */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --line: #e2e5e9; --line-2: #eff1f3; --fg: #16191d; --muted: #6a727c;
  --accent: #2c56c9; --accent-soft: #eef2fb; --stage: #e8ebee;
  --r: 12px; --r-sm: 8px;
  --sh-1: 0 1px 2px rgba(16, 24, 40, .05), 0 0 0 1px rgba(16, 24, 40, .04);
  --sh-2: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .08);
}
body { letter-spacing: -.01em; }
/* header */
header { border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(16,24,40,.02); }
header h1 { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.tabs { padding: 3px; gap: 2px; background: var(--line-2); border-radius: 10px; }
.tabs button { padding: 6px 14px; border-radius: 7px; border-bottom: 0; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--sh-1); border-bottom: 0; }
.views { background: var(--line-2); border: 0; border-radius: 10px; }
.views button { border-radius: 7px; color: var(--muted); }
.views button:hover { background: rgba(255,255,255,.7); box-shadow: none; color: var(--fg); }
.views button[aria-pressed="true"] { background: var(--panel); color: var(--fg); box-shadow: var(--sh-1); }
.hdr-btn { border: 1px solid var(--line); border-left: 1px solid var(--line); box-shadow: none; border-radius: 9px; }
.hdr-btn .ic { background: var(--line-2); color: var(--fg); }
.hdr-btn .chev { color: var(--muted); }
.hdr-btn:hover { background: var(--line-2); }
.hdr-btn[aria-expanded="true"] { background: var(--fg); border-color: var(--fg); }
/* floating windows on the 3D view */
.float { border: 0; border-radius: var(--r); box-shadow: var(--sh-2); }
.phead { border-top: 0; border-bottom: 1px solid var(--line-2); border-radius: var(--r) var(--r) 0 0; padding: 10px 10px 10px 14px; font-size: 13.5px; font-weight: 650; }
.phead .ic, .fbtn .ic { background: var(--line-2); color: var(--fg); border-radius: 7px; }
.phead .x { border: 0; color: var(--muted); }
.phead .x:hover { background: var(--line-2); }
.fbtn { border: 0; border-left: 0; border-radius: 10px; box-shadow: var(--sh-2); }
.fbtn .chev { color: var(--muted); }
.fbtn:hover { background: var(--panel); box-shadow: 0 0 0 1px var(--line), var(--sh-2); }
.row.on { background: var(--accent-soft); border-left-color: var(--accent); }
.specs dd { font-family: var(--sans); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.dragmode { border: 0; box-shadow: var(--sh-2); border-radius: 10px; }
.dragmode button[aria-pressed="true"] { background: var(--fg); }
/* buttons */
.btn { border-radius: var(--r-sm); padding: 6px 12px; font-weight: 500; border-color: var(--line); transition: background .15s, border-color .15s; }
.btn:hover { background: var(--line-2); border-color: var(--line); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #2449b0; }
.mini { border-radius: 6px; }
/* segmented controls: a track, the selection is a raised chip */
.seg, .sg, .sp-views { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 0; border-radius: 10px; background: var(--line-2); overflow: visible; }
.seg button, .sg button { border: 0 !important; border-radius: 7px; padding: 5px 11px; font-size: 12.5px; color: var(--muted); font-weight: 500; background: transparent; }
.seg button:hover, .sg button:hover { color: var(--fg); background: rgba(255,255,255,.6); }
.seg button[aria-pressed="true"], .sg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); font-weight: 650; box-shadow: var(--sh-1); }
/* optics page frame */
#specPage, #bomPage { background: var(--bg); }
.sp-head h2 { font-size: 16px; letter-spacing: -.01em; }
.sp-list, .sp-main, .sp-side, .et-top, .iss-l, .iss-r, .bm-tbl, .bm-kpi div, .bm-wt { border: 0; border-radius: var(--r); box-shadow: var(--sh-1); }
.sp-cat { padding: 14px 14px 6px; font-size: 11px; letter-spacing: .04em; color: var(--muted); }
.sp-cat::before { width: 6px; height: 6px; border-radius: 50%; }
.sp-item { padding: 7px 12px 7px 14px; border-left: 0; border-radius: 8px; margin: 0 6px; width: calc(100% - 12px); }
.sp-item small { font: 400 11.5px/1.35 var(--sans); color: var(--muted); }
.sp-item .u { font: 500 11px/1 var(--sans); }
.sp-item:hover { background: var(--line-2); }
.sp-item.on { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.sp-item.on .u { color: var(--muted); }
.sp-item .dot { width: 6px; height: 6px; }
.d-check { background: transparent; border: 1.5px solid #c98a1d; } .d-cond { background: #9aa3ad; } .d-ok { background: #2a9d6a; } .d-empty { border-color: #c5cbd2; }
.sp-hero { border-top: 0; background: var(--panel); padding: 18px 22px 14px; border-bottom: 1px solid var(--line-2); }
.eyebrow { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cat); }
.sp-title h2 { font-size: 22px; letter-spacing: -.02em; }
.sp-title .en { font: 400 13px/1.3 var(--sans); color: var(--muted); }
.sp-hero .one { color: #3a424b; }
.demo-h { font-size: 12.5px; color: var(--fg); padding: 10px 22px; border-bottom: 1px solid var(--line-2); }
.sp-main .demo-ctl { padding: 12px 22px 0; }
.sp-main .demo-out { margin: 10px 22px 16px; font-size: 13.5px; color: #2b3138; }
.sp-main .demo-out b { color: var(--accent); }
.sp-more { padding: 16px 22px 22px; }
.sp-split::after { background: #d3d8de; }
/* right panel */
.ent-step { padding: 16px 18px; border-bottom: 1px solid var(--line-2); }
.ent-step h3 { font-size: 15px; letter-spacing: -.01em; }
.ent-step h4 { font-size: 11.5px; color: var(--muted); letter-spacing: .03em; font-weight: 650; }
.ef > span { font-size: 11.5px; }
.ef input:not([type=checkbox]) { height: 34px; padding: 6px 10px; border-radius: var(--r-sm); border-color: var(--line); font-size: 13px; transition: border-color .15s, box-shadow .15s; }
.ef input:hover { border-color: #cfd4da; }
.ef input:focus-visible { outline: 0; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(44,86,201,.15); }
#ef-raw-t, #ef-raw-tol { font-family: var(--sans); font-size: 13px; background: var(--line-2); border-color: transparent; }
.res { border-radius: 10px; border: 0; box-shadow: inset 0 0 0 1px var(--line); background: #fafbfc; padding: 12px 14px; }
.res-ok, .res-cond { background: #f4f7fd; box-shadow: inset 0 0 0 1px #d9e2f6; }
.res-check { background: #fdf9f1; box-shadow: inset 0 0 0 1px #efe2c6; }
.res .v { font-size: 17px; }
.sug { border-radius: 10px; border: 0; box-shadow: inset 0 0 0 1px #ecdcb8; background: #fdf9f1; }
.sts2 { display: flex; width: 100%; }
.sts2 button { flex: 1; text-align: center; }
.cmpmini td { font-size: 12.5px; }
.qs li { font-size: 13px; color: #2b3138; }
/* tables */
.etab { border: 0; border-radius: var(--r); overflow: hidden; box-shadow: var(--sh-1); }
.etab th { background: #fafbfc; font-weight: 600; font-size: 11.5px; letter-spacing: .02em; }
.etab td { border-bottom: 1px solid var(--line-2); }
.etab tr[data-erow]:hover { background: #fafbfc; }
.st { font-weight: 600; font-size: 11px; padding: 3px 8px; }
.st-check { background: #fbf3e2; color: #8a5a08; } .st-cond { background: #eef2fb; color: #2c56c9; } .st-ok { background: #e6f4ec; color: #1f6b41; }
.v.asm { color: #6d4a0c; } .v.asm i { color: #a87314; } .v.chk { color: #8a5a08; }
/* legend chips in the optics header */
.legend { font-size: 11.5px; color: var(--muted); gap: 10px; }
.expbar select { border-color: var(--line); border-radius: var(--r-sm); height: 32px; }
.vid input { border-radius: var(--r-sm); height: 32px; border-color: var(--line); }
/* lesson inside the LookDown item */
.lesson .ls-fig, .lesson .ls-ctl, .lesson .card { border: 0; box-shadow: var(--sh-1); }
.lesson .ls-steps button { border: 0; background: var(--line-2); }
.lesson .ls-steps button[aria-current="true"] { background: var(--panel); box-shadow: var(--sh-1); }
@media (max-width: 1600px) { .legend { display: none; } }
.ctrlhint { gap: 14px; padding: 7px 14px; font-size: 12.5px; color: var(--muted); pointer-events: none; }
.ctrlhint span { display: inline-flex; align-items: center; gap: 6px; padding: 0; color: var(--fg); font-weight: 500; }
.ctrlhint svg { color: var(--muted); flex: none; }
/* tutorial: a dark button by the title, then a spotlight that walks through each area */
.tour-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--fg); color: #fff; font-size: 13px; font-weight: 650; white-space: nowrap; box-shadow: 0 2px 8px rgba(16,24,40,.18); transition: transform .15s, box-shadow .15s; }
.tour-btn .q { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18); font-size: 12px; font-weight: 800; }
.tour-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(16,24,40,.25); }
.tour-btn.pulse { animation: tourPulse 1.8s ease-out 3; }
@keyframes tourPulse { 0% { box-shadow: 0 0 0 0 rgba(44,86,201,.55); } 100% { box-shadow: 0 0 0 14px rgba(44,86,201,0); } }
#tour { position: fixed; inset: 0; z-index: 40; cursor: pointer; }
#tourCard { cursor: default; }

input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; height: 22px; margin: 0; cursor: pointer; --p: 50%; }

  acf: { name:'ACF', full:'ACF (유리–FPC 접합 경계선)', en:'Anisotropic conductive film bond line', mat:'', conf:'photo', ex:[0,16,-3], photos:['tft-fpcb-map','fpcb-acf'],
    desc:'Bare PCB의 좁은 띠 끝이 TFT 유리 가장자리 전극에 겹쳐 붙은 경계선입니다. 이방성 도전 필름(ACF)을 사이에 두고 열과 압력으로 붙여서, 위아래로 마주 보는 전극끼리만 전기가 통합니다.',
    points:['ACF는 수십 µm 두께라 눈에는 유리 가장자리의 가는 선으로만 보입니다. 모델에서는 진한 선으로 표시했습니다.','이 선이 들뜨거나 갈라지면 화면의 일부 줄이 안 나오는 불량이 생깁니다.'],
    specs:[['방식','열압착 접합'],['위치','TFT 유리 아래 가장자리, 좁은 띠 폭만큼']] },
  cfpcb: { name:'Custom FPCB', full:'Custom FPCB (22×50, CON)', en:'Grey shielded cable · main PCB to Bare PCB', mat:'', conf:'photo', ex:[0,12,-6], photos:['tft-fpcb-map','ffc'],

  ledboard: { name:'LED 기판', full:'LED 기판 (추정)', en:'LED board + metal back plate', mat:'', conf:'guess', ex:[0,2,0], photos:['pgu-module','pgu-pad','fpcb-acf'],
    desc:'LED가 실장된 기판과 금속 백플레이트입니다. 뒷면이 실리콘 패드를 거쳐 방열판에 닿습니다. Bare PCB 아래로 튀어나온 흰 작은 기판이 LED 전원 입력부로 보입니다.',
    points:['열을 잘 전하는 금속 기판(MCPCB)일 가능성이 큽니다(추정).','Bare PCB 사진의 (c) 흰 기판: 커넥터에 검은 전선이 꽂혀 있고 GD60과 비슷한 글씨가 보입니다. PGU 뒷면 QR 라벨(65-GD-60)과 같은 표기라 LED 기판의 전원 탭으로 봤습니다(추정). 전선은 메인 PCB의 LED 칩에서 오는 LED 전원선입니다.'], specs:[] },
  lens: { name:'1차 렌즈', full:'1차 렌즈 (돔 렌즈 어레이)', en:'Primary dome lens array', mat:'PC', conf:'photo', ex:[0,7,0], photos:['lens1-s2g','lens-array','lens-array-angle'],

    points:['평행광이어야 TFT를 거의 수직으로 지나고, 미러들이 받아낼 수 있는 각도 안에 들어옵니다. 각도를 벗어난 빛은 그대로 버려집니다.'],

  lens2: { name:'2차 렌즈', full:'2차 렌즈 (허니콤 렌즈 어레이)', en:'Secondary honeycomb (fly-eye) lens array', mat:'', conf:'photo', ex:[0,9,0], photos:['lens2-s2g','hex-diffuser'],

  film: { name:'광학 필름', full:'광학 필름 (확산 시트)', en:'Diffuser / brightness film', mat:'', conf:'photo', ex:[0,11,0], photos:['film-s2g'],

    points:['확산 필름은 LED 점광원의 얼룩을 지웁니다.','HUD PGU에는 보통 휘도 향상 필름(BEF, DBEF)도 들어갑니다. DBEF는 TFT가 버릴 편광을 되돌려 재활용해 밝기를 높입니다. 이 제품의 정확한 필름 구성은 확인하지 못했습니다.'],

  concave: { name:'곡면경', full:'곡면경', en:'Concave freeform mirror', mat:'', conf:'photo', ex:[0,26,18], photos:['mirror-housing'],
    desc:'HUD 광학계의 핵심입니다. 작은 TFT 영상을 크게 확대하고, 영상이 운전자 앞 수 m 거리에 떠 있는 것처럼 보이게 만듭니다. 모터가 각도를 바꿔 운전자 눈높이에 맞춥니다.',

    specs:[['형상','자유곡면 (모델: 구면 R ≈ {R} cm)'],['구동','모터로 기울기 조절']] },
  fold: { name:'평면경', full:'평면경', en:'Flat fold mirror', mat:'', conf:'photo', ex:[0,26,-18], photos:['mirror-housing'],
    desc:'TFT에서 위로 올라온 빛을 곡면경 쪽으로 꺾어 보내는 작은 평면 미러입니다. 광로를 접어서 긴 광학 거리를 좁은 대시보드 안에 넣습니다.',

  pcb: { name:'Main PCB', full:'Main PCB', en:'Main board HATZK630-0100', mat:'', conf:'photo', ex:[-8,4,-16], photos:['pcb-front','pcb-shield','pcb-noshield','pcb-out','pcb-back','pcb-back-out','pcb-back-detail','lower-pcb'],

    points:['왼쪽 끝은 외부 커넥터와 전원부, 가운데는 차폐 캔 아래 영상처리·왜곡처리 IC, 오른쪽은 MCU와 내부 커넥터입니다. EEPROM은 뒷면에 있습니다.','실크 표기: 123015032578 / HATZK630-0100 / 2023-12-24 / VER:V03 / TW-8 2530 / UL E340729 94V0. TW는 기판 제조사 Trustwin 표기로 보입니다.','외부 커넥터는 두 개입니다. 검은 원통은 영상용 동축 커넥터(GMSL), 흰 4핀은 전원과 LIN 통신입니다.','기판은 AEC-Q100 대상이 아닙니다. 대신 화재 안전 등급 94V-0(UL 난연)을 받았습니다.'],
    specs:[['품번','HATZK630-0100 V03'],['제조사','Huizhou Trustwin Electronics'],['기판 P/N','미확인 (TW-8 · ASP1 계열 추정)'],['난연 등급','UL 94V-0'],['설계일','2023-12-24 (실크)']] },
  epson: { name:'왜곡처리 IC', full:'왜곡처리 IC (Warp 보정)', en:'EPSON S2D13V42F00A100', conf:'photo', on:'pcb', maker:'EPSON', pn:'S2D13V42F00A100', grade:'Grade 2', photos:['pcb-warp','pcb-mcu','pcb-noshield'],

    points:['윈드실드는 곡면이고 미러는 비스듬히 놓여 있어서, 영상을 그대로 띄우면 사다리꼴이나 활 모양으로 휩니다. 이 칩이 프레임마다 반대 방향으로 휜 영상을 만듭니다. 보기 설정의 워프 보정을 꺼 보세요.','미러 각도가 바뀌면 왜곡도 바뀌므로 각도별 보정값을 EEPROM에 두는 것이 일반적입니다.','마킹: EPSON / S2D13V42F00A1 / G25279358 / JAPAN. 차폐 캔 아래에 있습니다.'],
    specs:[['제조사','EPSON'],['P/N','S2D13V42F00A100'],['패키지','QFP (사진)'],['차량용 인증','AEC-Q100 Grade 2 (−40~105 °C)'],['수량','1']] },
  max: { name:'영상처리 IC', full:'영상처리 IC (Deserializer)', en:'Maxim MAX9278AGTM/V+T', conf:'photo', on:'pcb', maker:'Maxim (ADI)', pn:'MAX9278AGTM/V+T', grade:'Grade 2', photos:['pcb-warp'],
    desc:'차량에서 고속 직렬로 들어온 영상 데이터(GMSL)를 HUD가 처리할 수 있는 영상 신호로 바꿉니다.',

  mcu: { name:'MCU', full:'MCU', en:'Renesas R7F7016843AFP-C', conf:'photo', on:'pcb', maker:'Renesas', pn:'R7F7016843AFP-C', grade:'Grade 2', photos:['pcb-mcu'],

  { id: 'lda', cat: 'geo', en: 'LookDown / LookOver angle tolerance', ko: '하방각·측방각 공차', unit: 'deg', dir: 'low',
