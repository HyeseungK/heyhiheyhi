<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeekr 7X AR-HUD 해부도</title>
<meta name="description" content="Zeekr 7X AR-HUD(HA1SZK63E)를 분해 사진과 BOM으로 재구성한 3D 해부도. 부품별 보기, 분해, 차량 장착 상태의 광로.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the 3D stage fills everything under a slim header. Three folding windows float over it:
   parts (top-left, list ⇄ part detail), playback (top-right), product info (bottom-right). Light, plain engineering look. */
:root {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --line: #dde1e6;
  --line-2: #eceff2;
  --fg: #1c2228;
  --muted: #66717c;
  --accent: #1f62d1;
  --accent-soft: #e8f0fd;
  --amber: #c8780f;
  --ok: #1f8a4c;
  --stage: #e6e9ed;
  --hdr: 52px;
  --sans: 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--stage); color: var(--fg); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

header { position: fixed; z-index: 10; top: 0; left: 0; right: 0; height: calc(var(--hdr) + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 8px 18px; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 15.5px; font-weight: 700; white-space: nowrap; }
header .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ttl { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.sp { flex: 1; }
.views { display: flex; gap: 2px; }
.views button { padding: 6px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.views button:hover { background: var(--line-2); color: var(--fg); }
.views button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.hdr-btn { padding: 6px 11px; border-radius: 6px; font-size: 13px; border: 1px solid var(--line); white-space: nowrap; }
.hdr-btn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }

.stage { position: fixed; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0; background: var(--stage); overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

.float { position: absolute; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(20,30,40,.10); display: flex; flex-direction: column; min-height: 0; }
.phead { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--line-2); font-weight: 600; font-size: 13.5px; }
.phead .x { margin-left: auto; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); display: grid; place-items: center; }
.phead .x:hover { background: var(--line-2); color: var(--fg); }
.pbody { overflow: auto; min-height: 0; padding: 10px 14px 14px; }
.fbtn { position: absolute; z-index: 4; padding: 8px 13px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(20,30,40,.08); font-size: 13px; font-weight: 500; white-space: nowrap; }
.fbtn:hover { border-color: #b9c1c9; }
.col { position: absolute; z-index: 4; top: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.col > * { pointer-events: auto; }
.lcol { left: max(12px, env(safe-area-inset-left, 0px)); width: 300px; align-items: flex-start; }
.rcol { right: max(12px, env(safe-area-inset-right, 0px)); width: 330px; align-items: flex-end; }
.col .sp { flex: 1; pointer-events: none; }
.col .float { position: relative; width: 100%; }
.fbtn { position: relative; }
#left { flex: 0 1 auto; max-height: 100%; }
#left .pbody { padding: 0 0 12px; }
#play { flex: 0 0 auto; max-height: 52%; }
#info { flex: 0 1 auto; max-height: 100%; }
#info.big { flex: 1 1 auto; }
#settings { position: fixed; z-index: 11; top: calc(var(--hdr) + env(safe-area-inset-top, 0px) + 6px); right: max(12px, env(safe-area-inset-right, 0px)); width: 300px; padding: 12px 14px; display: grid; gap: 12px; }
.ctl { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl output { font-family: var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { padding: 4px 9px; font-size: 12.5px; color: var(--fg); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg); cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
.chks { display: flex; gap: 14px; }

/* parts tree */
.lv1-title { padding: 7px 14px; background: var(--line-2); font-weight: 700; font-size: 12.5px; position: sticky; top: 0; z-index: 1; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px; padding: 2px 8px 2px 0; border-left: 3px solid transparent; }
.row:hover { background: #f6f8fa; }
.row.on { background: var(--accent-soft); border-left-color: var(--accent); }
.row .nm { text-align: left; padding: 4px 0 4px var(--ind, 26px); font-size: 13px; line-height: 1.35; min-width: 0; }
.row.on .nm { color: var(--accent); font-weight: 600; }
.row .mat { font: 400 11px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.row .eye { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: #9aa4ae; }
.row .eye:hover { background: var(--line); color: var(--fg); }
.row.off .nm { opacity: .4; }

/* part detail */
.detail { padding: 10px 14px 0; }
.back { font-size: 12.5px; color: var(--accent); padding: 2px 0; margin-bottom: 8px; }
.crumb { font: 500 11px/1.3 var(--mono); color: var(--muted); margin-bottom: 4px; }
.detail h2 { margin: 0; font-size: 17px; line-height: 1.3; text-wrap: balance; }
.detail .en { font: 400 12px/1.4 var(--mono); color: var(--muted); margin: 2px 0 6px; }
.detail p, .pbody p { margin: 6px 0 8px; line-height: 1.65; font-size: 13.5px; }
.detail ul, .detail ol, .pbody ul { margin: 6px 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13px; }
.detail li { line-height: 1.6; }
.badge { display: inline-block; font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
.badge.photo { color: var(--ok); border-color: #b5dcc4; background: #f1faf4; }
.badge.bom { color: var(--accent); border-color: #c2d4f3; background: var(--accent-soft); }
.badge.guess { color: var(--amber); border-color: #ecd2ad; background: #fdf6ec; }
h3.sec { font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .06em; margin: 14px 0 8px; text-transform: uppercase; }
.specs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 12.5px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.specs dd.txt { font-family: var(--sans); font-size: 12.5px; line-height: 1.5; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.thumbs button { aspect-ratio: 1; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); background: #ddd; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.btn { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; background: var(--panel); white-space: nowrap; }
.btn:hover { border-color: #b9c1c9; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 4px; }
.kids { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.kids button { padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; }
.kids button:hover { border-color: var(--accent); color: var(--accent); }
.readout { font: 400 12px/1.7 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; background: #f6f8fa; border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 9px; margin: 8px 0; }
.readout b { color: var(--fg); font-weight: 500; }
.note { font-size: 12px; color: var(--muted); line-height: 1.55; }
.src { font-size: 12px; line-height: 1.6; padding-left: 16px; }
.k-amber { color: var(--amber); } .k-blue { color: var(--accent); } .k-gray { color: #7d868f; }

/* playback */
.pctl { display: flex; align-items: center; gap: 5px; }
.pctl .btn { padding: 5px 9px; }
.prog { height: 3px; background: var(--line-2); border-radius: 2px; overflow: hidden; margin: 9px 0 6px; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
.slist { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 1px; }
.slist button { width: 100%; display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; padding: 5px 6px; border-radius: 6px; font-size: 13px; }
.slist button:hover { background: #f6f8fa; }
.slist .n { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font: 500 10.5px/1 var(--mono); color: var(--muted); }
.slist li.on button { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.slist li.on .n { border-color: var(--accent); background: var(--accent); color: #fff; }
.slist .sdesc { margin: 2px 6px 8px 34px; font-size: 12.5px; line-height: 1.6; color: var(--fg); }

#tip { position: absolute; pointer-events: none; padding: 4px 8px; border-radius: 5px; background: var(--fg); color: #fff; font-size: 12px; transform: translate(12px, 12px); white-space: nowrap; z-index: 6; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.lbl { position: absolute; transform: translate(-50%, calc(-100% - 12px)); font-size: 12px; white-space: nowrap; padding: 3px 8px; border-radius: 5px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.lbl::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 12px; background: var(--fg); }
.lbl.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
.lbl.sel::after { background: var(--accent); }
.lbl.env { color: var(--muted); }
.lbl.side-l { transform: translate(calc(-100% - 16px), -50%); }
.lbl.side-r { transform: translate(16px, -50%); }
.lbl.side-l::after, .lbl.side-r::after { top: 50%; width: 16px; height: 1px; }
.lbl.side-l::after { left: 100%; }
.lbl.side-r::after { left: auto; right: 100%; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font-size: 12px; color: var(--muted); pointer-events: none; transition: opacity .4s; white-space: nowrap; }

#lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(20,24,28,.92); display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: calc(env(safe-area-inset-top, 0px) + 52px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
#lightbox img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; display: block; min-height: 0; }
#lightbox .bar { display: flex; gap: 10px; align-items: center; justify-content: center; padding-top: 12px; color: #dfe4e8; font-size: 13px; }
#lightbox .close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); }

@media (max-width: 1100px) { header .sub { display: none; } }
@media (max-width: 900px) {
  :root { --hdr: 92px; }
  header { flex-wrap: wrap; align-content: center; padding-top: calc(env(safe-area-inset-top, 0px) + 6px); }
  .ttl { width: calc(100% - 110px); }
  .views { order: 3; width: 100%; overflow-x: auto; }
  .lcol, .rcol { width: auto; }
  .col .float { position: fixed; z-index: 7; left: 8px; right: 8px; width: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); max-height: 55%; }
  .hint { display: none; }
}
</style>

<body>
<header>
  <div class="ttl"><h1>Zeekr 7X AR-HUD 해부도</h1><span class="sub">HA1SZK63E · 분해 사진과 BOM으로 만든 추정 모델</span></div>
  <nav class="views" aria-label="시점">
    <button data-view="iso" aria-pressed="true">전체</button>
    <button data-view="side">측면 단면</button>
    <button data-view="top">위에서</button>
    <button data-view="car">차량 장착</button>
    <button data-view="driver">운전자 시점</button>
  </nav>
  <span class="sp"></span>
  <button class="hdr-btn" id="setBtn" aria-expanded="false" aria-controls="settings">보기 설정 ▾</button>
</header>
<div id="settings" class="float" hidden role="dialog" aria-label="보기 설정">
  <label class="ctl" for="explode">분해 <input id="explode" type="range" min="0" max="1" step="0.01" value="0"><output id="explodeOut">0%</output></label>
  <div class="ctl">하우징 <div class="seg" id="housing"><button data-h="solid" aria-pressed="false">불투명</button><button data-h="ghost" aria-pressed="true">반투명</button><button data-h="cut" aria-pressed="false">단면</button></div><span></span></div>
  <div class="ctl">빛 <div class="seg" id="lightMode"><button data-l="off" aria-pressed="false">끔</button><button data-l="path" aria-pressed="false">경로</button><button data-l="anim" aria-pressed="true">흐름</button></div><span></span></div>
  <label class="ctl" for="tilt">미러 각도 <input id="tilt" type="range" min="-2" max="2" step="0.1" value="0"><output id="tiltOut">0.0°</output></label>
  <div class="chks"><label class="chk"><input type="checkbox" id="warp" checked> 워프 보정</label><label class="chk"><input type="checkbox" id="sun"> 햇빛 역유입</label></div>
</div>
<div class="stage" id="stage">
  <canvas id="c" aria-label="HUD 3D 모델. 드래그로 회전, 휠이나 핀치로 확대, 우클릭 또는 Shift 드래그로 이동."></canvas>
  <div id="labels"></div>
  <div id="tip" hidden></div>
  <div class="hint" id="hint">드래그 회전 · 휠 확대 · 우클릭/Shift 이동 · 부품 클릭 선택 · 더블클릭 단독 보기 · Esc 해제</div>
  <div class="col lcol">
    <button class="fbtn" id="leftBtn" aria-controls="left">☰ 부품 목록</button>
    <aside id="left" class="float" hidden aria-label="부품 목록"><div class="phead"><span>부품 목록</span><button class="x" data-closep="left" aria-label="부품 목록 접기">✕</button></div><div class="pbody" id="leftBody"></div></aside>
  </div>
  <div class="col rcol">
    <button class="fbtn" id="playBtn" aria-controls="play" hidden>▶ 작동 원리</button>
    <section id="play" class="float" aria-label="작동 원리 재생"><div class="phead"><span>HUD 작동 원리</span><button class="x" data-closep="play" aria-label="작동 원리 접기">✕</button></div><div class="pbody" id="playBody" aria-live="polite"></div></section>
    <span class="sp"></span>
    <button class="fbtn" id="infoBtn" aria-controls="info" hidden>ⓘ 정보</button>
    <section id="info" class="float" aria-label="정보"><div class="phead"><span id="infoTitle">제품 정보</span><button class="x" data-closep="info" aria-label="정보 창 접기">✕</button></div><div class="pbody" id="infoBody"></div></section>
  </div>
</div>

<div id="lightbox" hidden>
  <button class="btn close" id="lbClose">닫기 (Esc)</button>
  <img id="lbImg" alt="">
  <div class="bar"><button class="btn" id="lbPrev">‹ 이전</button><span id="lbCap"></span><button class="btn" id="lbNext">다음 ›</button></div>
</div>

document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));

/* labels: the selected part, plus the car-context points */
const anchors = {};
function anchorOf(id) {
  if (anchors[id]) return anchors[id]; const own = objs[ownerOf(id)].obj;
  if (P[id].on) return anchors[id] = chipCenters[id].clone();
  const b = new THREE.Box3().setFromObject(own), c = b.getCenter(V()); c.y = b.max.y; return anchors[id] = own.worldToLocal(c);
}
function drawLabels() {
  const r = stageEl.getBoundingClientRect(); let html = '';
  const add = (w, text, cls) => { const p = w.clone().project(camera); if (p.z > 1 || Math.abs(p.x) > 1.02 || Math.abs(p.y) > 1.02) return; html += `<div class="lbl ${cls}" style="left:${(p.x + 1) / 2 * r.width}px;top:${(1 - p.y) / 2 * r.height}px">${text}</div>`; };
  if (state.bl) { for (const [txt, id, y, side] of BL_LABELS) { if (state.hidden.has(id)) continue; add(V(side === 'L' ? PG.cx - PG.w / 2 - 1 : PG.cx + PG.w / 2 + 1, y + (BL_OFF[id] || 0) * state.blS, PG.cz), txt, side === 'L' ? 'side-l' : 'side-r'); } $('#labels').innerHTML = html; return; }
  const ids = selIds(); if (ids.length <= 8) ids.forEach(id => { const own = objs[ownerOf(id)]; if (own && own.obj.visible) add(own.obj.localToWorld(anchorOf(id).clone()), P[id].full, 'sel'); });
  if (state.car) { add(OPT.pw, '윈드실드 반사점', 'env'); add(OPT.eye.clone().add(V(0, 12, 0)), '운전자 눈 · 아이박스(파란 상자)', 'env'); add(OPT.rays[(NY >> 1) * NX + (NX >> 1)].virt.clone().add(V(0, 26, 0)), `허상 · ${fmt(OPT.vid / 100)} m 앞`, 'env'); }
  $('#labels').innerHTML = html;
}

/* ───────────────────────── loop ───────────────────────── */
function resize() { const w = stageEl.clientWidth, h = stageEl.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; frameOffset(); pMat.uniforms.uScale.value = pMatS.uniforms.uScale.value = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360)); }
new ResizeObserver(resize).observe(stageEl); addEventListener('resize', frameOffset);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now(), screwA = 0;
const col = new THREE.Color();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const k = 1 - Math.exp(-dt * (reduced ? 30 : 7));
  cam.t.lerp(cam.gt, k); cam.r += (cam.gr - cam.r) * k; cam.th += (cam.gth - cam.th) * k; cam.ph += (cam.gph - cam.ph) * k;
  camera.position.set(cam.t.x + cam.r * Math.sin(cam.ph) * Math.sin(cam.th), cam.t.y + cam.r * Math.cos(cam.ph), cam.t.z + cam.r * Math.sin(cam.ph) * Math.cos(cam.th)); camera.lookAt(cam.t);
  state.explode += (state.explodeT - state.explode) * k; state.blS += ((state.bl ? state.blT : 0) - state.blS) * k;
  for (const id in objs) { const o = objs[id]; o.obj.position.copy(o.base).addScaledVector(o.ex, state.explode); if (BL_OFF[id]) o.obj.position.y += BL_OFF[id] * state.blS; }
  playTick(dt);
  const dT = state.tiltT - state.tilt;
  if (Math.abs(dT) > 1e-4) { const st = Math.sign(dT) * Math.min(Math.abs(dT), dt * (reduced ? 20 : 1.6)); state.tilt += st; screwA += st * 40; concTilt.rotation.x = state.tilt * Math.PI / 180; OPT = trace(state.tilt * Math.PI / 180); rebuildLight(); document.querySelectorAll('.readout').forEach(r => { r.outerHTML = readout(); }); }
  concPivot.updateMatrixWorld(true);
  const ear = objs.motor.obj.worldToLocal(concTilt.localToWorld(V(CONC.w / 2 + .3, CONC.h / 2 * .82, -.9)));
  motor.nut.position.z = THREE.MathUtils.clamp(ear.z - 6, motor.z0 + .6, motor.z1 - .6); motor.screw.rotation.z = screwA;
  const nt = V(motor.x, motor.y + .55, motor.nut.position.z); motor.link.position.copy(nt).add(ear).multiplyScalar(.5); motor.link.scale.set(1, nt.distanceTo(ear), 1); motor.link.quaternion.setFromUnitVectors(Y, V().subVectors(ear, nt).normalize());
  motor.link.visible = state.explode < .03 && objs.motor.obj.visible;
  const assembled = state.explode < .05, hs = state.step >= 0 ? STEPS[state.step].seg : -1;
  const quiet = !play.on && !state.bl && selIds().length > 0, sig = (play.on && STEPS[play.i].seg === -1) || state.bl;
  lineMat.opacity = quiet ? .12 : .55;
  bPts.visible = state.bl && state.light === 'anim'; if (bPts.visible) updateBL(dt);
  rayLines.visible = assembled && state.light !== 'off' && !sig; centerLine.visible = beam.visible = rayLines.visible && !quiet; virtLines.visible = state.light !== 'off';
  photons.visible = assembled && state.light === 'anim' && !sig && !quiet;
  if (photons.visible) {
    const sp = reduced ? 0 : 1;
    for (let i = 0; i < NP; i++) {
      ph.s[i] += dt * sp; if (ph.s[i] >= TOTAL) spawn(i, false);
      let s = ph.s[i], seg = 0; while (seg < 4 && s > SEG_C[seg]) seg++;
      const r = ph.ray[i];
      if ((seg >= 1 && !rayLit[r]) || (seg === 4 && !state.car)) { spawn(i, false); s = 0; seg = 0; }
      const u = (s - (seg ? SEG_C[seg - 1] : 0)) / SEG_T[seg], a = paths[r][seg], b = paths[r][seg + 1];
      pPos[i * 3] = a.x + (b.x - a.x) * u; pPos[i * 3 + 1] = a.y + (b.y - a.y) * u; pPos[i * 3 + 2] = a.z + (b.z - a.z) * u;
      col.copy(seg === 0 ? cA : cB); if (hs >= 0 && seg !== hs) col.copy(cDim);
      pCol[i * 3] = col.r; pCol[i * 3 + 1] = col.g; pCol[i * 3 + 2] = col.b;
    }
    pGeo.attributes.position.needsUpdate = pGeo.attributes.color.needsUpdate = true;
  }
  renderer.render(scene, camera); drawLabels();
  requestAnimationFrame(tick);
}
for (let i = 0; i < NP; i++) spawn(i, true);
rebuildLight(); for (let i = 0; i < NP; i++) spawn(i, true);
resize(); applyVisual(); renderCard();
const phoneLayout = () => { if (mobile()) { setPanel('play', false); setPanel('info', false); setPanel('left', false); } };
phoneLayout(); matchMedia('(max-width: 900px)').addEventListener('change', phoneLayout);
cam.t.copy(cam.gt); cam.r = cam.gr; cam.th = cam.gth; cam.ph = cam.gph;
requestAnimationFrame(tick);
document.fonts && document.fonts.ready.then(() => { drawHUD(); rebuildLight(); [pcbTex, fpcTex, labelTex].forEach(t => t.userData.redraw()); });
window.__hud = { OPT: () => OPT, RAD, LCDR, HFOV, VFOV, state };
</script>
