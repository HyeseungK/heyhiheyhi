<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeekr 7X AR-HUD 해부도</title>
<meta name="description" content="Zeekr 7X AR-HUD(HA1SZK63E)를 분해 사진과 BOM으로 재구성한 3D 해부도. 부품별 보기, 분해, 차량 장착 상태의 광로.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: the 3D stage fills everything under a slim header. Three folding windows float over it:
   parts (top-left, list ⇄ part detail), playback (top-right), product info (bottom-right). Light, plain engineering look. */
:root {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --line: #dde1e6;
  --line-2: #eceff2;
  --fg: #1c2228;
  --muted: #66717c;
  --accent: #1f62d1;
  --accent-soft: #e8f0fd;
  --amber: #c8780f;
  --ok: #1f8a4c;
  --stage: #e6e9ed;
  --hdr: 52px;
  --sans: 'IBM Plex Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--stage); color: var(--fg); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

header { position: fixed; z-index: 10; top: 0; left: 0; right: 0; height: calc(var(--hdr) + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 8px 18px; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 15.5px; font-weight: 700; white-space: nowrap; }
header .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.ttl { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.sp { flex: 1; }
.viewbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
.viewbar .lab { font-size: 12px; font-weight: 600; color: var(--fg); white-space: nowrap; }
.views { display: flex; padding: 3px; gap: 3px; background: var(--line-2); border: 1px solid var(--line); border-radius: 9px; }
.views button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--fg); white-space: nowrap; }
.views button svg { width: 15px; height: 15px; flex: none; opacity: .75; }
.views button:hover { background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.views button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 1px 3px rgba(31,98,209,.35); }
.views button[aria-pressed="true"] svg { opacity: 1; }
.hdr-btn { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px 6px 7px; border-radius: 9px; font-size: 13.5px; font-weight: 600; border: 1px solid #c2d4f3; border-left: 3px solid var(--accent); background: var(--panel); white-space: nowrap; box-shadow: 0 2px 8px rgba(20,30,40,.06); }
.hdr-btn .ic { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.hdr-btn .ic svg { width: 14px; height: 14px; }
.hdr-btn .chev { color: var(--accent); font-size: 12px; font-weight: 500; }
.hdr-btn:hover { background: var(--accent-soft); }
.hdr-btn[aria-expanded="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.hdr-btn[aria-expanded="true"] .ic { background: rgba(255,255,255,.2); color: #fff; }
.hdr-btn[aria-expanded="true"] .chev { color: #fff; }

.stage { position: fixed; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0; background: var(--stage); overflow: hidden; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

.float { position: absolute; z-index: 4; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(20,30,40,.10); display: flex; flex-direction: column; min-height: 0; }
.phead { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: 10px 10px 0 0; font-weight: 700; font-size: 13.5px; }
.phead .ic { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; flex: none; }
.phead .x { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap; }
.phead .x:hover { background: var(--line-2); color: var(--fg); border-color: #b9c1c9; }
.pbody { overflow: auto; min-height: 0; padding: 10px 14px 14px; }
.fbtn { position: absolute; z-index: 4; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 9px; background: var(--panel); border: 1px solid #c2d4f3; border-left: 3px solid var(--accent); box-shadow: 0 4px 14px rgba(20,30,40,.10); font-size: 13.5px; font-weight: 600; color: var(--fg); white-space: nowrap; }
.fbtn .ic { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; }
.fbtn .chev { color: var(--accent); font-size: 12px; font-weight: 500; }
.fbtn:hover { background: var(--accent-soft); }
.col { position: absolute; z-index: 4; top: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.col > * { pointer-events: auto; }
.lcol { left: max(12px, env(safe-area-inset-left, 0px)); width: 300px; align-items: flex-start; }
.rcol { right: max(12px, env(safe-area-inset-right, 0px)); width: 330px; align-items: flex-end; }
.col .sp { flex: 1; pointer-events: none; }
.col .float { position: relative; width: 100%; }
.fbtn { position: relative; }
#left { flex: 0 1 auto; max-height: 100%; }
#left .pbody { padding: 0 0 12px; }
#play { flex: 0 0 auto; max-height: 52%; }
#info { flex: 0 1 auto; max-height: 100%; }
#info.big { flex: 1 1 auto; }
#settings { position: fixed; z-index: 11; top: calc(var(--hdr) + env(safe-area-inset-top, 0px) + 6px); right: max(12px, env(safe-area-inset-right, 0px)); width: 310px; padding: 0 14px 14px; display: grid; gap: 12px; border-top: 3px solid var(--accent); }
#settings .phead { border-top: 0; margin: 0 -14px; border-radius: 0; }
.ctl { display: grid; grid-template-columns: 80px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl output { font-family: var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; min-width: 3.4em; text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { padding: 4px 9px; font-size: 12.5px; color: var(--fg); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg); cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
.chks { display: flex; gap: 14px; }

/* parts tree */
.lv1-title { padding: 7px 14px; background: var(--line-2); font-weight: 700; font-size: 12.5px; position: sticky; top: 0; z-index: 1; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px; padding: 2px 8px 2px 0; border-left: 3px solid transparent; }
.row:hover { background: #f6f8fa; }
.row.on { background: var(--accent-soft); border-left-color: var(--accent); }
.row .nm { text-align: left; padding: 4px 0 4px var(--ind, 26px); font-size: 13px; line-height: 1.35; min-width: 0; }
.row.on .nm { color: var(--accent); font-weight: 600; }
.row .mat { font: 400 11px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.row .eye { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: #9aa4ae; }
.row .eye:hover { background: var(--line); color: var(--fg); }
.row.off .nm { opacity: .4; }

/* part detail */
.detail { padding: 10px 14px 0; }
.back { font-size: 12.5px; color: var(--accent); padding: 2px 0; margin-bottom: 8px; }
.crumb { font: 500 11px/1.3 var(--mono); color: var(--muted); margin-bottom: 4px; }
.detail h2 { margin: 0; font-size: 17px; line-height: 1.3; text-wrap: balance; }
.detail .en { font: 400 12px/1.4 var(--mono); color: var(--muted); margin: 2px 0 6px; }
.detail p, .pbody p { margin: 6px 0 8px; line-height: 1.65; font-size: 13.5px; }
.detail ul, .detail ol, .pbody ul { margin: 6px 0; padding-left: 18px; display: grid; gap: 5px; font-size: 13px; }
.detail li { line-height: 1.6; }
.badge { display: inline-block; font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 4px; border: 1px solid; white-space: nowrap; }
.badge.photo { color: var(--ok); border-color: #b5dcc4; background: #f1faf4; }
.badge.bom { color: var(--accent); border-color: #c2d4f3; background: var(--accent-soft); }
.badge.guess { color: var(--amber); border-color: #ecd2ad; background: #fdf6ec; }
h3.sec { font: 600 11px/1 var(--mono); color: var(--muted); letter-spacing: .06em; margin: 14px 0 8px; text-transform: uppercase; }
.specs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; margin: 0; font-size: 12.5px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.specs dd.txt { font-family: var(--sans); font-size: 12.5px; line-height: 1.5; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.thumbs button { aspect-ratio: 1; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); background: #ddd; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.btn { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 12.5px; background: var(--panel); white-space: nowrap; }
.btn:hover { border-color: #b9c1c9; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 4px; }
.kids { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
.kids button { padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12.5px; }
.kids button:hover { border-color: var(--accent); color: var(--accent); }
.readout { font: 400 12px/1.7 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; background: #f6f8fa; border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 9px; margin: 8px 0; }
.readout b { color: var(--fg); font-weight: 500; }
.note { font-size: 12px; color: var(--muted); line-height: 1.55; }
.src { font-size: 12px; line-height: 1.6; padding-left: 16px; }
.tablewrap { overflow-x: auto; }
.ptable { width: 100%; border-collapse: collapse; font-size: 12px; }
.ptable th { text-align: left; font-weight: 600; color: var(--muted); padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); }
.ptable td { padding: 5px 6px 5px 0; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.ptable td.mono { font-family: var(--mono); font-size: 11px; overflow-wrap: anywhere; }
.ptable tbody tr { cursor: pointer; }
.ptable tbody tr:hover { background: #f6f8fa; }
.tabs { display: flex; gap: 2px; flex: none; }
.tabs button { flex: none; white-space: nowrap; padding: 7px 12px; font-size: 13.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
body[data-tab="spec"] .stage, body[data-tab="spec"] .viewbar, body[data-tab="spec"] #setBtn { display: none; }
#specPage { position: fixed; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0; overflow: auto; background: var(--bg); }
.sp-wrap { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#specBody { flex: 1; min-height: 0; overflow: auto; }
.sp-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.sp-head h2 { margin: 0; font-size: 17px; }
.vid { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.vid input { width: 64px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; color: var(--fg); }
.sp-views { background: var(--panel); }
.hint2 { font-size: 11.5px; color: var(--muted); }
.sp-grid { height: 100%; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; }
.sp-list { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 0 8px; overflow: auto; min-height: 0; }
.sp-cat { display: flex; align-items: center; gap: 7px; font: 700 11.5px/1 var(--sans); color: var(--fg); padding: 12px 12px 6px; }
.sp-cat::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--cat); }
.sp-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 10px 6px 12px; border-left: 3px solid transparent; font-size: 13.5px; }
.sp-item .t { flex: 1; min-width: 0; }
.sp-item .u { font: 500 10.5px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.sp-item small { display: block; font: 400 11px/1.3 var(--mono); color: var(--muted); }
.sp-item:hover { background: #f6f8fa; }
.sp-item.on { background: color-mix(in srgb, var(--cat) 10%, white); border-left-color: var(--cat); color: var(--cat); font-weight: 600; }
.sp-item.on .u { color: var(--cat); }
.sp-detail { min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; }
.sp-main { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sp-side { min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px 16px 16px; }
.sp-side ul { padding-left: 18px; display: grid; gap: 5px; margin: 4px 0; }
.sp-side li { line-height: 1.55; font-size: 13px; }
.sp-hero { padding: 12px 18px 12px; border-top: 4px solid var(--cat); background: linear-gradient(180deg, color-mix(in srgb, var(--cat) 7%, white), white); border-bottom: 1px solid var(--line-2); }
.eyebrow { font: 700 11.5px/1 var(--sans); color: var(--cat); letter-spacing: .04em; margin-bottom: 6px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.facts div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.facts span { font-size: 11.5px; color: var(--muted); }
.facts b { font: 600 13.5px/1.2 var(--mono); color: var(--fg); overflow-wrap: anywhere; }
.facts b.empty { color: #aab3bc; font-weight: 500; font-family: var(--sans); font-size: 13px; }
.lead { font-size: 14px; line-height: 1.7; margin: 10px 0 4px; }
.schem { margin: 4px 0 8px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfd; padding: 6px 6px 8px; }
.schem svg { width: 100%; height: auto; display: block; }
.schem figcaption { font-size: 11.5px; color: var(--muted); padding: 2px 6px 0; }
.schem .node { cursor: pointer; }
.schem .part, .schem .housing, .schem .glass { fill: none; stroke: #b7c0c9; stroke-width: 2; }
.schem rect.part, .schem circle.part { fill: #eef1f4; }
.schem .housing { stroke-dasharray: 4 3; stroke-width: 1.2; }
.schem .glass { stroke-width: 3; stroke: #c9dbe9; }
.schem .lv1 .part, .schem .lv1 .glass, .schem .lv1 .housing { stroke: var(--cat); stroke-width: 2.4; }
.schem .lv1 rect.part, .schem .lv1 circle.part { fill: #fff; }
.schem .lv2 .part, .schem .lv2 .glass, .schem .lv2 .housing { stroke: var(--cat); stroke-width: 3.4; }
.schem .lv2 rect.part, .schem .lv2 circle.part { fill: var(--cat); }
.schem .node:hover .part, .schem .node:hover .glass { stroke-width: 4; }
.schem .beam { fill: none; stroke: var(--cat); stroke-width: 1.6; opacity: .5; }
.schem .beam.virt { stroke-dasharray: 5 5; opacity: .35; }
.schem .eye { fill: var(--fg); }
.schem .eyebox { fill: none; stroke: var(--fg); stroke-dasharray: 3 2; }
.schem .vi { stroke: var(--fg); stroke-width: 4; }
.schem .lab { font: 500 11px var(--sans); fill: #9aa4ae; }
.schem .lab.lv1 { fill: var(--fg); }
.schem .lab.lv2 { fill: var(--cat); font-weight: 700; }
.schem .lab.small { font-size: 9.5px; fill: var(--muted); }
.sp-detail .pchip.lv2 { border-color: var(--cat); color: var(--cat); }
.sp-detail .demo-out b { color: var(--cat); }
.vidbox { max-width: 340px; display: grid; gap: 4px; }
.vidbox .note { margin: 0; font-size: 11.5px; }
.sp-detail > p { line-height: 1.7; max-width: 75ch; margin: 6px 0 4px; }
.sp-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.sp-title h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.sp-title .en { font: 400 12.5px/1.3 var(--mono); color: var(--muted); }
.sp-title .unit { font: 500 12px/1 var(--mono); padding: 4px 7px; border-radius: 4px; background: var(--line-2); }
.sp-cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 4px 28px; }
.sp-cols ul { padding-left: 18px; display: grid; gap: 6px; margin: 4px 0; }
.sp-cols li { line-height: 1.6; font-size: 13.5px; }
.sp-key { border-left: 3px solid var(--cat); padding: 2px 0 2px 10px; }
.sp-key .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sp-key .sys { font-size: 12.5px; color: var(--muted); }
.sp-key p { margin: 6px 0 0; font-size: 13px; line-height: 1.6; }
.pchip { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
.pchip.lv2 { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pchip:hover { background: var(--accent-soft); }
.demo { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fbfcfd; }
.sp-main .demo { flex: 1; min-height: 0; display: flex; flex-direction: column; border: 0; border-radius: 0; }
.sp-main .demo canvas { flex: 1; min-height: 160px; height: auto; }
.demo canvas { display: block; width: 100%; height: clamp(220px, 32vw, 320px); }
.demo-ctl { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 10px 14px 0; font-size: 12.5px; color: var(--muted); }
.demo-ctl label { display: flex; align-items: center; gap: 8px; }
.demo-ctl input[type=range] { width: 170px; accent-color: var(--accent); }
.demo-ctl select { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.demo-ctl output { font-family: var(--mono); color: var(--fg); min-width: 5em; }
.demo-out { margin: 8px 14px 12px; font-size: 13px; line-height: 1.65; }
.demo-out b { color: var(--accent); }
.sp-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sp-form .wide { grid-column: 1 / -1; }
.sp-form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.sp-form input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; color: var(--fg); min-width: 0; }
.iss-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 14px; align-items: start; }
.iss-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
@media (max-width: 1000px) { .iss-layout { grid-template-columns: minmax(0, 1fr); } }
.iss { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.iss h3 { margin: 0 0 4px; font-size: 15px; }
.iss .en { font: 400 11.5px/1 var(--mono); color: var(--muted); }

function gamutStd(g, w, h, pN, pS, RS) {
  const STD = [['NTSC', NTSC, '#66717c', [5, 4], '1953 · 아날로그 TV'], ['sRGB', SRGB, '#c8780f', [2, 3], '1996 · PC·웹·대부분의 모니터'], ['DCI-P3', P3, '#2a9d6a', [6, 3], '2007 · 영화관·최신 휴대폰'], ['BT.2020', BT2020, '#8a4fd1', [1, 3], '2012 · UHD 방송 목표']];
  const tw = Math.min(w * .5, h * .95), m = cie(g, tw, h), c0 = NTSC.reduce((a, p) => [a[0] + p[0] / 3, a[1] + p[1] / 3], [0, 0]), sc = Math.sqrt(pN / 100);
  tri(g, m, NTSC.map(([x, y]) => [c0[0] + (x - c0[0]) * sc, c0[1] + (y - c0[1]) * sc]), '#1f62d1', 'rgba(31,98,209,.14)');
  STD.forEach(([, p, c, d]) => tri(g, m, p, c, null, d));
  const x0 = tw + 24, bw = w - x0 - 110, A = p => triArea(p) / triArea(NTSC) * 100, rows = [...STD.map(([n, p, c, , t]) => [n, A(p), c, t]), ['이 HUD', pN, '#1f62d1', `= sRGB의 ${pS}%`]].sort((a, b) => b[1] - a[1]), mx = Math.max(...rows.map(r => r[1]));
  g.font = '600 12px "IBM Plex Sans KR", sans-serif'; g.fillStyle = '#1c2228'; g.fillText('삼각형 면적 (NTSC = 100)', x0, 22);
  const rh = Math.min(52, (h - 40) / rows.length);
  rows.forEach(([n, a, c, t], i) => { const y = 36 + i * rh, bwid = a / mx * bw; g.fillStyle = c; g.globalAlpha = n === '이 HUD' ? 1 : .75; g.fillRect(x0, y, bwid, 16); g.globalAlpha = 1;
    g.fillStyle = '#1c2228'; g.font = `${n === '이 HUD' ? 700 : 600} 12px "IBM Plex Sans KR", sans-serif`; g.fillText(`${n}  ${Math.round(a)}`, x0 + bwid + 6, y + 13); g.fillStyle = '#66717c'; g.font = '11px "IBM Plex Sans KR", sans-serif'; g.fillText(t, x0, y + 30); });
  return `<b>RGB</b>는 기준이 아니라 방식입니다. 모든 디스플레이가 빨강·초록·파랑 세 원색을 섞어 색을 만들고, 세 원색의 위치가 삼각형 꼭짓점입니다. <b>NTSC·sRGB·DCI-P3·BT.2020</b>은 "이 세 점을 기준으로 삼자"고 정한 기준 삼각형입니다.<br>
    그래서 같은 디스플레이도 기준에 따라 숫자가 바뀝니다. 같은 색도도(CIE 1931 xy)·같은 면적비 방식을 가정하면 sRGB는 NTSC 면적의 약 ${Math.round(RS * 100)}%(흔히 약 72%로 인용)라서 <b>NTSC ${Math.round(RS * 100)}% ≈ sRGB 100%</b>, <b>sRGB 90% ≈ NTSC ${Math.round(90 * RS)}%</b>, <b>NTSC 70% ≈ sRGB ${Math.round(70 / RS)}%</b>입니다.<br>
    또 "면적비"는 넓이만 비교하고, "커버리지"는 기준 삼각형을 실제로 얼마나 덮는지입니다. 면적이 100%여도 삼각형이 비뚤면 커버리지는 낮을 수 있어서, 스펙에는 기준·면적/커버리지·CIE 1931/1976 중 무엇인지 함께 적어야 합니다.`;
}

function drawISS() {

    const M = imgW() / LCDR.w, arcmin = d / 10 * M / (SP.vid * 100) * 180 / Math.PI * 60, pxPerDeg = w / 24, size = Math.max(1.5, arcmin / 60 * pxPerDeg * 4);

    else { const r = size + blur * 40, a = Math.max(.06, 1 - blur) * (kind === 1 ? .9 : .8); const cx = x0 + hw * .3, cy = y0 + hh * .55;

}

/* tabs */
let curTab = 'struct';

  document.body.dataset.tab = t; $('#specPage').hidden = t !== 'spec'; $('#bomPage').hidden = t !== 'bom';

}

/* ───────────────────────── loop ───────────────────────── */
function resize() { const w = stageEl.clientWidth, h = stageEl.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h; frameOffset(); pMat.uniforms.uScale.value = pMatS.uniforms.uScale.value = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360)); }

  state.explode += (state.explodeT - state.explode) * k; state.blS += ((state.bl ? state.blT : 0) - state.blS) * k;
  for (const id in objs) { const o = objs[id]; o.obj.position.copy(o.base).addScaledVector(o.ex, state.explode); if (BL_OFF[id]) o.obj.position.y += BL_OFF[id] * state.blS; }
  playTick(dt);

  concPivot.updateMatrixWorld(true);

  const quiet = !play.on && !state.bl && selIds().length > 0, sig = (play.on && STEPS[play.i].seg === -1) || state.bl;

  rayLines.visible = assembled && state.light !== 'off' && !sig; centerLine.visible = beam.visible = rayLines.visible && !quiet; virtLines.visible = state.light !== 'off';
  photons.visible = assembled && state.light === 'anim' && !sig && !quiet;
  if (photons.visible) {
    const sp = reduced ? 0 : 1;
    for (let i = 0; i < NP; i++) {
      ph.s[i] += dt * sp; if (ph.s[i] >= TOTAL) spawn(i, false);

      const u = (s - (seg ? SEG_C[seg - 1] : 0)) / SEG_T[seg], a = paths[r][seg], b = paths[r][seg + 1];

for (let i = 0; i < NP; i++) spawn(i, true);
